name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres.major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - major: 14
            image: postgres:14.22-alpine
          - major: 15
            image: postgres:15.17-alpine
          - major: 16
            image: postgres:16.13-alpine
          - major: 17
            image: postgres:17.9-alpine
          - major: 18
            image: postgres:18.3-alpine
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_DB: cord
          POSTGRES_PASSWORD: ${{ format('cord-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CORD_POSTGRES_DSN: ${{ format('postgres://postgres:cord-{0}-{1}@127.0.0.1:5432/cord?sslmode=disable', github.run_id, github.run_attempt) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: true

      - name: Run PostgreSQL compatibility tests
        run: go tool task test-postgres

  goreleaser:
    needs: postgres
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
