name: Deploy playground

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'internal/storage/sqlite/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Taskfile.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            playground/go.sum

      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.53.1'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install playground dependencies
        run: bun install --cwd playground --frozen-lockfile --ignore-scripts

      - name: Build playground
        env:
          CORD_COMPILER_URL: ${{ vars.CORD_COMPILER_URL }}
        run: |
          if test -z "$CORD_COMPILER_URL"; then
            echo "::error::Set the CORD_COMPILER_URL repository variable to the HTTPS /compile endpoint."
            exit 1
          fi
          task playground-build -- -prefix /cord

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/playground

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
