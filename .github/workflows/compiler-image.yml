name: Publish compiler image

on:
  push:
    branches: [master, main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cord-playground-compiler

jobs:
  publish:
    name: Publish compiler image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build compiler image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: playground/Dockerfile
          load: true
          tags: cord-playground-compiler:local

      - name: Smoke-test compiler image
        run: go tool task playground-compiler-image-test

      - name: Scan compiler image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cord-playground-compiler:local
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate compiler image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: cord-playground-compiler:local
          format: spdx-json
          output-file: compiler-image.spdx.json
          upload-artifact: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo 'value<<EOF'
            if printf '%s' "$REF_NAME" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "$IMAGE:$REF_NAME"
            fi
            echo "$IMAGE:sha-${GITHUB_SHA}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Push validated compiler image
        id: push
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.value }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag cord-playground-compiler:local "$tag"
            docker push "$tag"
          done <<EOF
          $IMAGE_TAGS
          EOF

          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-${GITHUB_SHA}")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: compiler-image.spdx.json
