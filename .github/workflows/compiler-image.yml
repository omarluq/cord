name: Publish compiler image

on:
  push:
    branches: [master, main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cord-playground-compiler

jobs:
  publish:
    name: Publish compiler image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          check-latest: false
          cache: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build compiler image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: playground/Dockerfile
          load: true
          tags: cord-playground-compiler:local

      - name: Smoke-test compiler image
        run: task playground-compiler-image-test

      - name: Scan compiler image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cord-playground-compiler:local
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate compiler image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cord-playground-compiler:local
          format: spdx-json
          output-file: compiler-image.spdx.json
          upload-artifact: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo 'value<<EOF'
            if printf '%s' "$REF_NAME" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "$IMAGE:$REF_NAME"
            fi
            echo "$IMAGE:sha-${GITHUB_SHA}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Push validated compiler image
        id: push
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.value }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag cord-playground-compiler:local "$tag"
            docker push "$tag"
          done <<EOF
          $IMAGE_TAGS
          EOF

          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-${GITHUB_SHA}")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: compiler-image.spdx.json
