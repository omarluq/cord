name: PostgreSQL compatibility

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres.major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - major: 14
            image: postgres:14.22-alpine
          - major: 15
            image: postgres:15.17-alpine
          - major: 16
            image: postgres:16.13-alpine
          - major: 17
            image: postgres:17.9-alpine
          - major: 18
            image: postgres:18.3-alpine
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_DB: cord
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CORD_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/cord?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          check-latest: false
          cache: true

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1

      - name: Run PostgreSQL compatibility tests
        run: task test-postgres
