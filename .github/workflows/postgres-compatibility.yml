name: PostgreSQL compatibility

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres.major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - major: 14
            image: postgres:14.22-alpine
          - major: 15
            image: postgres:15.17-alpine
          - major: 16
            image: postgres:16.13-alpine
          - major: 17
            image: postgres:17.9-alpine
          - major: 18
            image: postgres:18.3-alpine
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_DB: cord
          POSTGRES_PASSWORD: ${{ format('cord-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CORD_POSTGRES_DSN: ${{ format('postgres://postgres:cord-{0}-{1}@127.0.0.1:5432/cord?sslmode=disable', github.run_id, github.run_attempt) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          check-latest: false
          cache: true

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1

      - name: Record PostgreSQL version
        run: |
          mkdir -p evidence
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'requested_image=%s\n' '${{ matrix.postgres.image }}'
            printf 'server_version='
            docker exec "${{ job.services.postgres.id }}" postgres --version
            go version
          } | tee "evidence/postgresql-${{ matrix.postgres.major }}-version.txt"

      - name: Run PostgreSQL compatibility tests
        run: |
          set -o pipefail
          task test-postgres 2>&1 | tee "evidence/postgresql-${{ matrix.postgres.major }}-race-shuffle.txt"

      - name: Record PostgreSQL cancellation benchmarks
        run: |
          set -o pipefail
          task benchmark-postgres 2>&1 | tee "evidence/postgresql-${{ matrix.postgres.major }}-benchmarks.txt"

      - name: Upload PostgreSQL evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgresql-compatibility-${{ matrix.postgres.major }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  performance:
    name: Benchmark evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1

      - name: Record benchmarks
        run: |
          mkdir -p evidence
          set -o pipefail
          task benchmark 2>&1 | tee evidence/benchmarks.txt

      - name: Record evidence metadata
        if: ${{ !cancelled() }}
        run: |
          mkdir -p evidence
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            go version
          } > evidence/metadata.txt

      - name: Upload benchmark evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cancellation-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
