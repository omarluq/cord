name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Compiler container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0-rc.2'
          check-latest: false
          cache: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0

      - name: Build compiler image
        run: task playground-compiler-image

      - name: Smoke-test compiler image
        run: task playground-compiler-image-test

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cord-playground-compiler:local
          format: spdx-json
          output-file: compiler-image.spdx.json
          upload-artifact: false

      - name: Scan compiler image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cord-playground-compiler:local
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload image security artifacts
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiler-image-security
          path: compiler-image.spdx.json
          if-no-files-found: error

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: '1.27.0-rc.2'
          check-latest: false
          go-package: ./...
          repo-checkout: false

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0-rc.2'
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            playground/go.sum

      - name: Check module tidiness
        run: |
          go mod tidy
          go mod tidy -C playground
          git diff --exit-code -- go.mod go.sum playground/go.mod playground/go.sum

      - name: golangci-lint
        run: go tool golangci-lint run ./... ./playground/...

      - name: Dead code
        run: go tool deadcode -test -filter='^github.com/omarluq/cord/(internal|examples)/' ./examples/... ./internal/...

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0

      - name: Test
        run: task test-coverage

      - name: Build
        run: task build

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install browser test dependencies
        run: |
          bun install --cwd playground --frozen-lockfile --ignore-scripts
          playground/node_modules/.bin/playwright install --with-deps chromium

      - name: Test WebAssembly playground
        run: task playground-test

      - name: Upload playground artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cord-playground
          path: dist/playground
          if-no-files-found: error

      - name: Upload coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.out
          flags: unittests
          slug: omarluq/cord
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
