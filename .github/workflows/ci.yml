name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: '1.27.0-rc.2'
          check-latest: false
          go-package: ./...
          repo-checkout: false

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0-rc.2'
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            playground/go.sum

      - name: Check module tidiness
        run: |
          go mod tidy
          go mod tidy -C playground
          git diff --exit-code -- go.mod go.sum playground/go.mod playground/go.sum

      - name: golangci-lint
        run: go tool golangci-lint run ./... ./playground/...

      - name: Dead code
        run: go tool deadcode -test -filter='^github.com/omarluq/cord/(internal|examples)/' ./examples/... ./internal/...

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0

      - name: Test
        run: task test-coverage

      - name: Build
        run: task build

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install browser test dependencies
        run: |
          bun install --cwd playground --frozen-lockfile --ignore-scripts
          cd playground
          bunx playwright install --with-deps chromium

      - name: Test WebAssembly playground
        run: task playground-test

      - name: Upload playground artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cord-playground
          path: dist/playground
          if-no-files-found: error

      - name: Upload coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.out
          flags: unittests
          slug: omarluq/cord
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
