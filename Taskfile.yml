version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build all packages in the workspace
    cmds:
      - go build ./... ./playground/...

  build-library:
    desc: Build the Cord library without CGO
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build ./...

  playground-install:
    desc: Install pinned playground dependencies
    sources:
      - playground/package.json
      - playground/bun.lock
    generates:
      - playground/node_modules/.bin/tsc
      - playground/node_modules/.bin/playwright
    cmds:
      - bun install --cwd "{{.ROOT_DIR}}/playground" --frozen-lockfile --ignore-scripts

  playground-assets:
    desc: Build the playground JavaScript and stylesheet assets with Bun
    sources:
      - playground/**/*.go
      - playground/package.json
      - playground/bun.lock
      - playground/tsconfig*.json
      - playground/web/editor.ts
      - playground/web/worker.ts
      - playground/web/tailwind.css
    generates:
      - dist/playground/web/playground.js
      - dist/playground/web/worker.js
      - dist/playground/web/playground.css
    deps: [playground-install]
    cmds:
      - bun run --cwd "{{.ROOT_DIR}}/playground" assets
      - bun run --cwd "{{.ROOT_DIR}}/playground" css

  playground-build:
    desc: Build the static WebAssembly playground
    cmds:
      - go run ./playground/cmd/build -output dist/playground {{.CLI_ARGS}}
      - task: playground-assets
      - GOOS=js GOARCH=wasm go build -ldflags="-X github.com/omarluq/cord/playground.configuredCompilerURL=${CORD_COMPILER_URL:-}" -o dist/playground/web/app.wasm ./playground/cmd/wasm

  playground-compiler:
    desc: Run the local Go-to-WebAssembly compilation endpoint
    cmds:
      - go run ./playground/cmd/compiler -addr 127.0.0.1:4180 -allowed-origin http://127.0.0.1:4173,http://127.0.0.1:4174,http://localhost:4173,http://localhost:4174

  playground-compiler-image:
    desc: Build the playground compiler container image
    cmds:
      - docker build -f playground/Dockerfile -t cord-playground-compiler:local .

  playground-compiler-image-test:
    desc: Smoke-test the playground compiler container image
    cmds:
      - |
        sh -eu -c '
          container=cord-playground-compiler-test
          response=$(mktemp)
          standard_library_source=$(mktemp)
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -f "$response" "$standard_library_source"
          }
          trap cleanup EXIT INT TERM
          cleanup
          docker run --detach --rm \
            --name "$container" \
            --publish 127.0.0.1:4180:8080 \
            cord-playground-compiler:local >/dev/null

          ready=false
          for _ in $(seq 1 600); do
            if curl --fail --silent http://127.0.0.1:4180/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if test "$ready" != true; then
            docker logs "$container"
            exit 1
          fi

          compile() {
            jq -Rs "{source: .}" "$1" | \
              curl --fail --silent --show-error \
                --header "Content-Type: application/json" \
                --data-binary @- \
                --output "$response" \
                http://127.0.0.1:4180/compile
            test -s "$response"
          }

          compile playground/examples/linear.go.txt

          cat >"$standard_library_source" <<"EOF"
        package main

        import (
          "archive/zip"
          "crypto/sha256"
          "encoding/json"
          "html/template"
          "image/png"
          "net/http"
        )

        func main() {
          _, _, _, _, _, _ = zip.Store, sha256.Size, json.Valid, template.HTMLEscapeString, png.DefaultCompression, http.MethodGet
        }
        EOF
          compile "$standard_library_source"
        '

  playground-serve:
    desc: Serve the built playground locally
    deps: [playground-build]
    cmds:
      - go run ./playground/cmd/serve -dir dist/playground

  playground-dev:
    desc: Run the compiler container and live-reload the playground with Air
    cmds:
      - task: playground-compiler-image
      - |
        sh -eu -c '
          container=cord-playground-compiler-dev
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          cleanup
          docker run --detach --rm \
            --name "$container" \
            --publish 127.0.0.1:4180:8080 \
            cord-playground-compiler:local \
            -allowed-origin http://127.0.0.1:4173,http://127.0.0.1:4174,http://localhost:4173,http://localhost:4174 >/dev/null

          ready=false
          for _ in $(seq 1 300); do
            if curl --fail --silent http://127.0.0.1:4180/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if test "$ready" != true; then
            docker logs "$container"
            exit 1
          fi

          go tool air -c .air.playground.toml
        '

  playground-browser-install:
    desc: Install the pinned Playwright Chromium browser and Linux system dependencies
    deps: [playground-install]
    cmds:
      - playground/node_modules/.bin/playwright install --with-deps chromium

  playground-test:
    desc: Compile and exercise a user-authored Cord workflow in Chromium
    deps: [playground-browser-install]
    cmds:
      - task: playground-build
      - mkdir -p .tmp
      - rm -f .tmp/playground-ready
      - go build -o .tmp/playground-serve ./playground/cmd/serve
      - go build -o .tmp/playground-compiler ./playground/cmd/compiler
      - pkill -f '^.tmp/playground-(serve|compiler)' 2>/dev/null || true
      - .tmp/playground-serve -dir dist/playground -ready-file .tmp/playground-ready >.tmp/playground-server.log 2>&1 &
      - .tmp/playground-compiler -addr 127.0.0.1:4180 -allowed-origin http://127.0.0.1:4173 >.tmp/playground-compiler.log 2>&1 &
      - defer: pkill -f '^.tmp/playground-(serve|compiler)' 2>/dev/null || true
      - |
        ready=false
        for _ in $(seq 1 300); do
          if test -f .tmp/playground-ready && curl --fail --silent http://127.0.0.1:4180/healthz >/dev/null; then
            ready=true
            break
          fi
          sleep 0.1
        done
        if test "$ready" != true; then
          cat .tmp/playground-server.log .tmp/playground-compiler.log
          exit 1
        fi
      - bun run --cwd "{{.ROOT_DIR}}/playground" test

  test:
    desc: Run workspace tests with the race detector
    cmds:
      - go test -race -shuffle=on ./... ./playground/...

  test-short:
    desc: Run short workspace tests with the race detector
    cmds:
      - go test -race -short -shuffle=on ./... ./playground/...

  test-coverage:
    desc: Run library tests and write a coverage profile
    cmds:
      - go test -race -shuffle=on -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

  test-postgres:
    desc: Run mandatory PostgreSQL integration tests and pgx examples
    preconditions:
      - sh: test -n "${CORD_POSTGRES_DSN:-}"
        msg: CORD_POSTGRES_DSN is required (for example, postgres://postgres:postgres@localhost:5432/cord?sslmode=disable)
    cmds:
      - go test -race -shuffle=on ./internal/storage/postgres/...
      - go run ./examples/linear/pg
      - go run ./examples/join/pg

  playground-test-coverage:
    desc: Run playground tests and write a separate coverage profile
    cmds:
      - go test -race -shuffle=on -coverpkg=./playground/... -coverprofile=playground-coverage.out -covermode=atomic ./playground/...

  lint:
    desc: Run static analysis across the workspace
    cmds:
      - go tool golangci-lint run ./... ./playground/...

  deadcode:
    desc: Report unreachable internal and example functions
    cmds:
      - go tool deadcode -test -filter='^github.com/omarluq/cord/(internal|examples)/' ./examples/... ./internal/...

  fmt:
    desc: Format and fix Go source
    cmds:
      - go tool golangci-lint fmt
      - go tool golangci-lint run --fix

  fmt-check:
    desc: Check formatting without modifying files
    cmds:
      - go tool golangci-lint fmt --diff ./... ./playground/...

  ci:
    desc: Run all checks (requires Docker; installs pinned browser dependencies)
    cmds:
      - task: fmt-check
      - task: lint
      - task: deadcode
      - task: test
      - task: build-library
      - task: build
      - task: playground-build
