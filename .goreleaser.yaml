# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: cord

builds:
  - skip: true

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## cord {{ .Version }}

    Go library release generated by GoReleaser.
