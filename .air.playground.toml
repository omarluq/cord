root = "."
tmp_dir = ".tmp/air-playground"

[build]
cmd = "go tool task playground-build && go build -o .tmp/air-playground/serve ./playground/cmd/serve"
entrypoint = [".tmp/air-playground/serve", "-dir", "dist/playground"]
include_ext = ["go", "ts", "js", "css", "svg", "mod", "sum"]
include_dir = ["playground", "internal", "docs"]
include_file = ["go.mod", "go.sum", "go.work", "playground/go.mod", "playground/go.sum", "Taskfile.yml"]
exclude_dir = ["dist", "node_modules", ".tmp", ".git"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = false
main_only = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true

[proxy]
enabled = true
proxy_port = 4174
app_port = 4173
app_start_timeout = 15000
