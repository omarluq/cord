version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

output:
  show-stats: true

linters:
  enable:
    # Core
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Quality
    - revive
    - gosec
    - bodyclose
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - godot
    - errname
    - errorlint
    - exhaustive
    - funlen
    - gocognit
    - goprintffuncname
    - lll
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - thelper
    - unconvert
    - unparam
    - whitespace
    - paralleltest
    - tparallel
    - wastedassign
    - exhaustruct_v5
    - varnamelen
    - forbidigo
    - cyclop

    # Safety / correctness
    - asasalint
    - bidichk
    - canonicalheader
    - durationcheck
    - errchkjson
    - fatcontext
    - forcetypeassert
    - makezero
    - nilnesserr
    - nilnil
    - nosprintfhostport
    - rowserrcheck
    - sqlclosecheck
    - usestdlibvars

    # Modernization / tests / performance
    - copyloopvar
    - modernize
    - perfsprint
    - testifylint
    - testpackage
    - dupword
    - zerologlint

    # Strict style / API hygiene
    - gochecknoglobals
    - gomodguard_v2
    - ireturn
    - mnd
    - musttag
    - nlreturn
    - tagliatelle
    - wrapcheck
    - wsl_v5

  exclusions:
    rules:
      # go-app requires callbacks to receive its value Context type.
      - linters: [gocritic]
        path: "playground/app\\.go"
        text: "hugeParam: (ctx|_) is heavy"
      # configuredCompilerURL is an ldflags injection point and embedded assets must be variables.
      - linters: [gochecknoglobals]
        path: "playground/(app|examples)\\.go"
        text: "(configuredCompilerURL|linearSource|branchJoinSource|retrySource|largePipelineSource|httpRequestSource|permanentFailureSource) is a global variable"
      # Remote libSQL exposes one database per container; this exact semaphore serializes those tests.
      - linters: [gochecknoglobals]
        path: "internal/storage/sqlite/turso/driver_test\\.go"
        text: "libSQLContainerSlot is a global variable"

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - github.com/maxence-charriere/go-app/v11/pkg/app.UI

    gocyclo:
      min-complexity: 10

    gocognit:
      min-complexity: 15

    funlen:
      lines: 80
      statements: 50

    dupl:
      threshold: 100

    goconst:
      min-len: 3
      min-occurrences: 3

    lll:
      line-length: 120
      tab-width: 4

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: true

    revive:
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gosec:
      config:
        global:
          nosec: true
          audit: true

    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          mapstructure: snake

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style

    exhaustruct_v5:
      enforce-patterns:
        - ^github\.com/omarluq/cord/.*
      allow-empty: true
      explicit-mode: true
